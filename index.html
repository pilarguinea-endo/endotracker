function hexToRgb(hex) {
  const m = hex.replace("#", "");
  return { r: parseInt(m.substring(0, 2), 16), g: parseInt(m.substring(2, 4), 16), b: parseInt(m.substring(4, 6), 16) };
}
function chipTint(color, alpha) {
  const { r, g, b } = hexToRgb(color);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ---------- Date helpers ----------
const TODAY = new Date(2026, 6, 22); // Jul 22, 2026

function dateKey(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function parseDateKey(str) {
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function daysBetween(a, b) {
  return Math.round((new Date(b.getFullYear(), b.getMonth(), b.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
}
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function formatDate(d) {
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function labelForDate(d) {
  return dateKey(d) === dateKey(TODAY) ? "Today" : formatDate(d);
}
function isWithinPeriod(date, periods) {
  return periods.some((p) => {
    const end = p.end || TODAY;
    return date >= new Date(p.start.getFullYear(), p.start.getMonth(), p.start.getDate()) && date <= new Date(end.getFullYear(), end.getMonth(), end.getDate());
  });
}
function findPeriodIndexForDate(periods, date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  return periods.findIndex((p) => {
    const end = p.end || TODAY;
    const s = new Date(p.start.getFullYear(), p.start.getMonth(), p.start.getDate());
    const e = new Date(end.getFullYear(), end.getMonth(), end.getDate());
    return d >= s && d <= e;
  });
}
function emptyEntries() {
  const e = {};
  SYSTEMS.forEach((s) => (e[s.id] = []));
  return e;
}
function findLog(logs, date) {
  return logs.find((l) => dateKey(l.dateObj) === dateKey(date));
}

// ---------- Google Sheets sync ----------
// After deploying the Apps Script web app (see setup instructions), paste its URL here.
// Leave as-is and the app runs in local demo mode with the seed data below.
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwE6mRP8DZh0OYqYXWCN4OVNyJHj1ZtORDElLYvbwvweR1J1N5_iXk27IxcqriA45kciA/exec";
const SYNC_ENABLED = WEBAPP_URL.startsWith("https://");

function serializeState(logs, periods) {
  return JSON.stringify({
    logs: logs.map((l) => ({ date: dateKey(l.dateObj), entries: l.entries, substances: l.substances || [] })),
    periods: periods.map((p) => ({ start: dateKey(p.start), end: p.end ? dateKey(p.end) : null })),
  });
}
function deserializeState(data) {
  const logs = (data.logs || []).map((l) => {
    const d = parseDateKey(l.date);
    return { dateObj: d, dateLabel: labelForDate(d), entries: l.entries, substances: l.substances || [] };
  });
  const periods = (data.periods || []).map((p) => ({ start: parseDateKey(p.start), end: p.end ? parseDateKey(p.end) : null }));
  return { logs: logs.sort((a, b) => a.dateObj - b.dateObj), periods: periods.sort((a, b) => a.start - b.start) };
}

function buildInitialLogs() {
  const logs = SEED_SYMPTOM_LOG.map(({ date, items }) => {
    const entries = emptyEntries();
    items.forEach(([systemId, symptomId, location]) => {
      entries[systemId].push({ id: `${systemId}-${symptomId}-${dateKey(date)}`, symptomId, note: "", location: location || "" });
    });
    return { dateObj: new Date(date), dateLabel: labelForDate(date), entries };
  });
  if (!logs.some((l) => dateKey(l.dateObj) === dateKey(TODAY))) {
    logs.push({ dateObj: new Date(TODAY), dateLabel: "Today", entries: emptyEntries() });
  }
  return logs.sort((a, b) => a.dateObj - b.dateObj);
}

function systemCount(entriesArray) {
  return entriesArray.length;
}
function symptomCountForDay(entriesArray, symptomId) {
  return entriesArray.filter((e) => e.symptomId === symptomId).length;
}

// ---------- App ----------
export default function App() {
  const [tab, setTab] = useState("calendar");
  const [logs, setLogs] = useState(buildInitialLogs);
  const [periods, setPeriods] = useState(SEED_PERIODS);
  const [logDate, setLogDate] = useState(new Date(TODAY));
  const [syncStatus, setSyncStatus] = useState(SYNC_ENABLED ? "loading" : "demo");
  const hasLoadedRef = useRef(!SYNC_ENABLED);
  const saveTimerRef = useRef(null);

  // Load saved data from the Google Sheet on first mount.
  useEffect(() => {
    if (!SYNC_ENABLED) return;
    fetch(WEBAPP_URL)
      .then((res) => res.json())
      .then((data) => {
        const { logs: loadedLogs, periods: loadedPeriods } = deserializeState(data);
        setLogs(loadedLogs.length ? loadedLogs : [{ dateObj: new Date(TODAY), dateLabel: "Today", entries: emptyEntries(), substances: [] }]);
        setPeriods(loadedPeriods);
        setSyncStatus("synced");
        hasLoadedRef.current = true;
      })
      .catch(() => {
        setSyncStatus("error");
        hasLoadedRef.current = true;
      });
  }, []);

  // Save to the Google Sheet whenever logs or periods change, debounced.
  useEffect(() => {
    if (!SYNC_ENABLED || !hasLoadedRef.current) return;
    setSyncStatus("saving");
    clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(() => {
      fetch(WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: serializeState(logs, periods),
      })
        .then(() => setSyncStatus("synced"))
        .catch(() => setSyncStatus("error"));
    }, 800);
    return () => clearTimeout(saveTimerRef.current);
  }, [logs, periods]);

  const lastPeriod = periods[periods.length - 1];
  const periodActive = lastPeriod && !lastPeriod.end;
  const currentCycleDay = lastPeriod ? daysBetween(lastPeriod.start, TODAY) + 1 : null;

  function goToLogDay(date) {
    setLogDate(date);
    setTab("painlog");
  }

  function startPeriod(date, end = null) {
    if (periodActive && end === null) return;
    setPeriods((prev) => [...prev, { start: date, end }].sort((a, b) => a.start - b.start));
  }
  function updatePeriod(index, patch) {
    setPeriods((prev) => prev.map((p, i) => (i === index ? { ...p, ...patch } : p)).sort((a, b) => a.start - b.start));
  }
  function deletePeriod(index) {
    setPeriods((prev) => prev.filter((_, i) => i !== index));
  }
  function addSymptomEntries(date, systemId, entriesToAdd) {
    setLogs((prev) => {
      const key = dateKey(date);
      const idx = prev.findIndex((l) => dateKey(l.dateObj) === key);
      const newItems = entriesToAdd.map((e) => ({ ...e, id: `${systemId}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}` }));
      if (idx === -1) {
        const entries = emptyEntries();
        entries[systemId] = newItems;
        const newLog = { dateObj: new Date(date), dateLabel: labelForDate(date), entries };
        return [...prev, newLog].sort((a, b) => a.dateObj - b.dateObj);
      }
      return prev.map((l, i) => (i === idx ? { ...l, entries: { ...l.entries, [systemId]: [...l.entries[systemId], ...newItems] } } : l));
    });
  }
  function removeSymptomEntry(date, systemId, entryId) {
    setLogs((prev) =>
      prev.map((l) =>
        dateKey(l.dateObj) === dateKey(date)
          ? { ...l, entries: { ...l.entries, [systemId]: l.entries[systemId].filter((e) => e.id !== entryId) } }
          : l
      )
    );
  }
  function updateSubstances(date, substances) {
    setLogs((prev) => {
      const key = dateKey(date);
      const idx = prev.findIndex((l) => dateKey(l.dateObj) === key);
      if (idx === -1) {
        const newLog = { dateObj: new Date(date), dateLabel: labelForDate(date), entries: emptyEntries(), substances };
        return [...prev, newLog].sort((a, b) => a.dateObj - b.dateObj);
      }
      return prev.map((l, i) => (i === idx ? { ...l, substances } : l));
    });
  }

  const fontStyles = (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
      * { box-sizing: border-box; }
      button { font-family: inherit; }
      input, textarea, select { font-family: inherit; }
      @media print {
        .print-hide { display: none !important; }
        body, html { background: #fff !important; }
      }
    `}</style>
  );

  return (
    <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", background: COLORS.bg, color: COLORS.ink, minHeight: "100vh", width: "100%" }}>
      {fontStyles}

      <div style={{ maxWidth: 720, margin: "0 auto", padding: "28px 20px 60px" }}>
        <div className="print-hide" style={{ marginBottom: 22, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <LogoMark size={36} />
            <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: 30, letterSpacing: "-0.01em" }}>EndoTracker</div>
          </div>
          <div style={{ fontSize: 11.5, fontWeight: 500 }}>
            {syncStatus === "demo" && <span style={{ color: COLORS.inkFaint }}>Demo mode · not saved</span>}
            {syncStatus === "loading" && <span style={{ color: COLORS.inkFaint }}>Loading…</span>}
            {syncStatus === "saving" && <span style={{ color: COLORS.inkFaint }}>Saving…</span>}
            {syncStatus === "synced" && <span style={{ color: COLORS.hormonal }}>✓ Synced</span>}
            {syncStatus === "error" && <span style={{ color: COLORS.flareText }}>Sync failed — check connection</span>}
          </div>
        </div>

        {tab !== "painlog" && (
          <div className="print-hide" style={{ display: "flex", gap: 4, borderBottom: `1px solid ${COLORS.line}`, marginBottom: 24, flexWrap: "wrap" }}>
            {[
              { id: "calendar", label: "Calendar" },
              { id: "periodlog", label: "Cycle Log" },
              { id: "summary", label: "Summary" },
            ].map((t) => (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                style={{
                  background: "none", border: "none", cursor: "pointer", padding: "10px 12px", fontSize: 13.5, fontWeight: 500,
                  color: tab === t.id ? COLORS.ink : COLORS.inkFaint,
                  borderBottom: tab === t.id ? `2px solid ${COLORS.ink}` : "2px solid transparent", marginBottom: -1, whiteSpace: "nowrap",
                }}
              >
                {t.label}
              </button>
            ))}
          </div>
        )}

        {tab === "painlog" && (
          <PainLogTab logs={logs} addSymptomEntries={addSymptomEntries} removeSymptomEntry={removeSymptomEntry} updateSubstances={updateSubstances} selectedDate={logDate} setSelectedDate={setLogDate} onBack={() => setTab("calendar")} />
        )}
        {tab === "calendar" && (
          <CalendarTab logs={logs} periods={periods} periodActive={periodActive} currentCycleDay={currentCycleDay} startPeriod={startPeriod} updatePeriod={updatePeriod} deletePeriod={deletePeriod} onLogDay={goToLogDay} />
        )}
        {tab === "periodlog" && <PeriodLogTab periods={periods} logs={logs} />}
        {tab === "summary" && <SummaryTab logs={logs} periods={periods} />}
      </div>
    </div>
  );
}

// ---------- Pain Log tab ----------
function PainLogTab({ logs, addSymptomEntries, removeSymptomEntry, updateSubstances, selectedDate, setSelectedDate, onBack }) {
  const [selected, setSelected] = useState({});
  const [locations, setLocations] = useState({});
  const [infoSymptomId, setInfoSymptomId] = useState(null);
  const [note, setNote] = useState("");
  const [justSaved, setJustSaved] = useState(false);
  const [savedLabels, setSavedLabels] = useState([]);
  const [showOtherInput, setShowOtherInput] = useState(false);
  const [otherText, setOtherText] = useState("");

  const currentLog = findLog(logs, selectedDate) || { dateObj: selectedDate, entries: emptyEntries() };
  const previousLog = findLog(logs, addDays(selectedDate, -1));
  const isToday = dateKey(selectedDate) === dateKey(TODAY);
  const currentSubstances = currentLog.substances || [];
  const presetLabels = SUBSTANCE_OPTIONS.map((o) => o.label);
  const customSubstances = currentSubstances.filter((s) => !presetLabels.includes(s));

  function toggleSubstance(label) {
    const next = currentSubstances.includes(label) ? currentSubstances.filter((s) => s !== label) : [...currentSubstances, label];
    updateSubstances(selectedDate, next);
  }
  function removeSubstance(label) {
    updateSubstances(selectedDate, currentSubstances.filter((s) => s !== label));
  }
  function addOtherSubstance() {
    const trimmed = otherText.trim();
    if (!trimmed) return;
    if (!currentSubstances.includes(trimmed)) updateSubstances(selectedDate, [...currentSubstances, trimmed]);
    setOtherText("");
  }

  function toggle(systemId, symptomId) {
    setSelected((prev) => {
      const cur = prev[systemId] || [];
      const next = cur.includes(symptomId) ? cur.filter((id) => id !== symptomId) : [...cur, symptomId];
      return { ...prev, [systemId]: next };
    });
    setLocations((prev) => {
      const isCurrentlySelected = (selected[systemId] || []).includes(symptomId);
      if (!isCurrentlySelected) return prev;
      const next = { ...prev };
      delete next[symptomId];
      return next;
    });
  }
  function setLocationFor(symptomId, value) {
    setLocations((prev) => ({ ...prev, [symptomId]: value }));
  }
  function applyRepeat(systemId, symptomId) {
    setSelected((prev) => {
      const cur = prev[systemId] || [];
      if (cur.includes(symptomId)) return prev;
      return { ...prev, [systemId]: [...cur, symptomId] };
    });
  }
  const totalSelected = Object.values(selected).reduce((a, arr) => a + arr.length, 0);
  const selectedLabels = [];
  const selectedLocationSymptoms = [];
  Object.entries(selected).forEach(([systemId, symptomIds]) => {
    const system = SYSTEMS.find((s) => s.id === systemId);
    symptomIds.forEach((id) => {
      const sym = system.symptoms.find((sy) => sy.id === id);
      selectedLabels.push(sym.label);
      if (sym.needsLocation) selectedLocationSymptoms.push({ symptomId: id, label: sym.label, color: system.color });
    });
  });

  function handleSave() {
    if (!totalSelected) return;
    Object.entries(selected).forEach(([systemId, symptomIds]) => {
      if (symptomIds.length) {
        addSymptomEntries(
          selectedDate,
          systemId,
          symptomIds.map((id) => ({ symptomId: id, note, location: (locations[id] || "").trim() }))
        );
      }
    });
    setSavedLabels(selectedLabels);
    setSelected({});
    setLocations({});
    setNote("");
    setJustSaved(true);
    setTimeout(() => setJustSaved(false), 2200);
  }

  const yesterdayItems = [];
  if (previousLog) {
    SYSTEMS.forEach((s) => {
      previousLog.entries[s.id].forEach((e) => {
        if (e.symptomId !== "general") yesterdayItems.push({ system: s, symptomId: e.symptomId });
      });
    });
  }

  return (
    <div>
      <button
        onClick={onBack}
        style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", cursor: "pointer", color: COLORS.inkSoft, fontSize: 13, padding: 0, marginBottom: 16 }}
      >
        <ChevronLeft size={16} />
        Back to calendar
      </button>
      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 14, marginBottom: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <div>
            <div style={{ fontSize: 11.5, color: COLORS.inkFaint, textTransform: "uppercase", letterSpacing: "0.03em", marginBottom: 2 }}>Logging for</div>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, fontWeight: 600 }}>
              {labelForDate(selectedDate)}
              {isToday && <span style={{ color: COLORS.inkFaint, fontWeight: 500 }}> · {formatDate(selectedDate)}</span>}
            </div>
          </div>
        </div>

        {yesterdayItems.length > 0 && (
          <div style={{ marginTop: 14 }}>
            <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 8 }}>
              {isToday ? "Yesterday" : formatDate(addDays(selectedDate, -1))}'s symptoms, tap each if you feel them {isToday ? "today" : "that day"}.
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {yesterdayItems.map((item, i) => (
                <button
                  key={i}
                  onClick={() => applyRepeat(item.system.id, item.symptomId)}
                  style={{
                    display: "flex", alignItems: "center", gap: 5,
                    background: chipTint(item.system.color, 0.14),
                    border: `1.5px solid ${item.system.color}`,
                    borderRadius: 16, padding: "5px 10px", fontSize: 12, color: COLORS.ink, cursor: "pointer", fontWeight: 500,
                  }}
                >
                  <RotateCcw size={11} />
                  {symptomLabel(item.system, item.symptomId)}
                </button>
              ))}
            </div>
          </div>
        )}

        {!isToday && (
          <button
            onClick={() => { setSelectedDate(new Date(TODAY)); setSelected({}); setNote(""); }}
            style={{ marginTop: 10, background: "none", border: "none", padding: 0, color: COLORS.inkSoft, fontSize: 12.5, cursor: "pointer", textDecoration: "underline" }}
          >
            Back to today
          </button>
        )}
      </div>

      <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.inkSoft, marginBottom: 10 }}>What symptoms happened {isToday ? "today" : "that day"}? Tap all that apply.</div>

      {SYSTEMS.map((s) => (
        <div key={s.id} style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5, fontWeight: 600, marginBottom: 8 }}>
            <span style={{ width: 9, height: 9, borderRadius: 9, background: s.color, display: "inline-block" }} />
            {s.label}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {s.symptoms.map((sym) => {
              const isSel = (selected[s.id] || []).includes(sym.id);
              const showInfo = infoSymptomId === sym.id;
              return (
                <Fragment key={sym.id}>
                  <span style={{ display: "inline-flex", alignItems: "stretch" }}>
                    <button
                      onClick={() => toggle(s.id, sym.id)}
                      aria-pressed={isSel}
                      style={{
                        background: isSel ? chipTint(s.color, 0.32) : chipTint(s.color, 0.14),
                        border: `${isSel ? 2 : 1.5}px solid ${s.color}`, borderRight: "none",
                        borderTopLeftRadius: 16, borderBottomLeftRadius: 16, padding: "6px 4px 6px 11px", fontSize: 12.5,
                        color: COLORS.ink,
                        cursor: "pointer", fontWeight: isSel ? 700 : 500,
                      }}
                    >
                      {sym.label}
                    </button>
                    <button
                      onClick={() => setInfoSymptomId(showInfo ? null : sym.id)}
                      aria-label={`What is ${sym.label}?`}
                      aria-expanded={showInfo}
                      style={{
                        display: "flex", alignItems: "center", justifyContent: "center",
                        background: isSel ? chipTint(s.color, 0.32) : chipTint(s.color, 0.14),
                        border: `${isSel ? 2 : 1.5}px solid ${s.color}`, borderLeft: "none",
                        borderTopRightRadius: 16, borderBottomRightRadius: 16, padding: "6px 10px 6px 2px", minWidth: 24, minHeight: 24,
                        color: COLORS.ink, cursor: "pointer",
                        fontStyle: "italic", fontWeight: 700, fontSize: 12, fontFamily: "serif",
                      }}
                    >
                      i
                    </button>
                  </span>
                  {showInfo && (
                    <div style={{ flexBasis: "100%", fontSize: 12, color: COLORS.inkSoft, background: COLORS.bg, borderRadius: 8, padding: "8px 12px", lineHeight: 1.5 }}>
                      <strong style={{ color: COLORS.ink }}>{sym.label}:</strong> {sym.description}
                    </div>
                  )}
                </Fragment>
              );
            })}
          </div>
        </div>
      ))}

      <div style={{ marginBottom: 20 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.inkSoft, marginBottom: 10 }}>What did you take {isToday ? "today" : "that day"}? Tap all that apply.</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {SUBSTANCE_OPTIONS.map((opt) => {
            const isSel = currentSubstances.includes(opt.label);
            return (
              <button
                key={opt.id}
                onClick={() => toggleSubstance(opt.label)}
                aria-pressed={isSel}
                style={{
                  background: isSel ? chipTint(SUBSTANCE_COLOR, 0.32) : chipTint(SUBSTANCE_COLOR, 0.14),
                  border: `${isSel ? 2 : 1.5}px solid ${SUBSTANCE_COLOR}`,
                  borderRadius: 16, padding: "6px 14px", fontSize: 12.5,
                  color: COLORS.ink,
                  cursor: "pointer", fontWeight: isSel ? 700 : 500,
                }}
              >
                {opt.label}
              </button>
            );
          })}
          <button
            onClick={() => setShowOtherInput((v) => !v)}
            aria-pressed={showOtherInput}
            style={{
              background: showOtherInput ? chipTint(SUBSTANCE_COLOR, 0.32) : chipTint(SUBSTANCE_COLOR, 0.14),
              border: `${showOtherInput ? 2 : 1.5}px solid ${SUBSTANCE_COLOR}`,
              borderRadius: 16, padding: "6px 14px", fontSize: 12.5,
              color: COLORS.ink,
              cursor: "pointer", fontWeight: showOtherInput ? 700 : 500,
            }}
          >
            Other
          </button>
          {customSubstances.map((label) => (
            <span
              key={label}
              style={{ display: "inline-flex", alignItems: "center", gap: 6, background: chipTint(SUBSTANCE_COLOR, 0.32), border: `2px solid ${SUBSTANCE_COLOR}`, color: COLORS.ink, borderRadius: 16, padding: "6px 6px 6px 14px", fontSize: 12.5, fontWeight: 700 }}
            >
              {label}
              <button onClick={() => removeSubstance(label)} aria-label={`Remove ${label}`} style={{ background: "none", border: "none", color: SUBSTANCE_COLOR, cursor: "pointer", display: "flex", alignItems: "center", padding: 2 }}>
                <X size={12} />
              </button>
            </span>
          ))}
        </div>
        {showOtherInput && (
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <input
              type="text"
              value={otherText}
              onChange={(e) => setOtherText(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addOtherSubstance(); } }}
              placeholder="Enter what you took"
              style={{ flex: 1, padding: "8px 12px", borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13, color: COLORS.ink }}
            />
            <button
              onClick={addOtherSubstance}
              style={{ padding: "8px 16px", borderRadius: 8, border: "none", background: SUBSTANCE_COLOR, color: COLORS.bg, fontSize: 13, fontWeight: 500, cursor: "pointer" }}
            >
              Add
            </button>
          </div>
        )}
      </div>

      {(totalSelected > 0 || justSaved) && <div style={{ height: totalSelected > 0 ? 172 : 76 }} />}

      <LoggedList log={currentLog} label={labelForDate(selectedDate)} onRemove={(systemId, entryId) => removeSymptomEntry(selectedDate, systemId, entryId)} />

      {(totalSelected > 0 || justSaved) && (
        <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, display: "flex", justifyContent: "center", padding: "12px 16px", zIndex: 50, pointerEvents: "none" }}>
          <div style={{ width: "100%", maxWidth: 688, background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 14, boxShadow: "0 -4px 16px rgba(36,49,43,0.12)", pointerEvents: "auto" }}>
            {totalSelected > 0 ? (
              <>
                <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 8 }}>Symptom Logged: {selectedLabels.join(", ")}</div>
                {selectedLocationSymptoms.length > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
                    {selectedLocationSymptoms.map((sym) => (
                      <div
                        key={sym.symptomId}
                        style={{ display: "flex", alignItems: "center", gap: 8, background: chipTint(sym.color, 0.1), border: `1px solid ${sym.color}`, borderRadius: 8, padding: "7px 10px" }}
                      >
                        <MapPin size={14} color={COLORS.inkSoft} style={{ flexShrink: 0 }} />
                        <input
                          type="text"
                          value={locations[sym.symptomId] || ""}
                          onChange={(e) => setLocationFor(sym.symptomId, e.target.value)}
                          placeholder={`Where — ${sym.label.toLowerCase()}`}
                          style={{ flex: 1, background: "none", border: "none", outline: "none", fontSize: 13, color: COLORS.ink, padding: 0 }}
                        />
                      </div>
                    ))}
                  </div>
                )}
                <textarea
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  placeholder="Add a note (optional)"
                  style={{ width: "100%", minHeight: 46, padding: 10, borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13, resize: "vertical", color: COLORS.ink, marginBottom: 10 }}
                />
                <button onClick={handleSave} style={{ width: "100%", padding: "9px 0", borderRadius: 8, border: "none", background: COLORS.ink, color: COLORS.bg, fontSize: 13, fontWeight: 500, cursor: "pointer" }}>
                  Save {totalSelected} symptom{totalSelected > 1 ? "s" : ""}
                </button>
              </>
            ) : (
              <div style={{ display: "flex", alignItems: "flex-start", gap: 8, fontSize: 13.5, fontWeight: 500, color: COLORS.ink }}>
                <Check size={16} color="#1F9D55" style={{ flexShrink: 0, marginTop: 1 }} />
                <span>Symptom Logged: {savedLabels.join(", ")}</span>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function LoggedList({ log, label, onRemove }) {
  const rows = [];
  SYSTEMS.forEach((s) => {
    log.entries[s.id].forEach((e) => rows.push({ system: s, entry: e }));
  });
  const substances = log.substances || [];
  if (!rows.length && !substances.length) return null;

  return (
    <div>
      <div style={{ fontSize: 11.5, color: COLORS.inkFaint, textTransform: "uppercase", letterSpacing: "0.03em", marginBottom: 8 }}>Logged for {label}</div>
      {substances.length > 0 && (
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "8px 12px", marginBottom: 8 }}>
          <span style={{ fontWeight: 500, color: COLORS.ink }}>Took:</span> {substances.join(", ")}
        </div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {rows.map(({ system, entry }) => (
          <div key={entry.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8, fontSize: 12.5, background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "8px 12px" }}>
            <div>
              <div style={{ fontWeight: 500 }}>{symptomLabel(system, entry.symptomId)} <span style={{ color: COLORS.inkFaint }}>· {system.short}</span></div>
              {entry.location && <div style={{ color: COLORS.inkSoft, marginTop: 2 }}>Location: {entry.location}</div>}
              {entry.note && <div style={{ color: COLORS.inkSoft, marginTop: 2 }}>{entry.note}</div>}
            </div>
            <button onClick={() => onRemove(system.id, entry.id)} aria-label={`Remove ${symptomLabel(system, entry.symptomId)}`} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkFaint, flexShrink: 0, minWidth: 24, minHeight: 24, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <X size={14} />
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- Calendar tab ----------
function CalendarTab({ logs, periods, periodActive, currentCycleDay, startPeriod, updatePeriod, deletePeriod, onLogDay }) {
  const [calendarMonth, setCalendarMonth] = useState(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
  const [selectedDay, setSelectedDay] = useState(null);
  const [editStart, setEditStart] = useState("");
  const [editEnd, setEditEnd] = useState("");
  const [confirmDeleteIdx, setConfirmDeleteIdx] = useState(null);
  const [pendingStartDate, setPendingStartDate] = useState(null);
  const deleteTimerRef = useRef(null);

  function handleDeleteClick(idx) {
    if (confirmDeleteIdx === idx) {
      clearTimeout(deleteTimerRef.current);
      setConfirmDeleteIdx(null);
      deletePeriod(idx);
      if (selectedDay && findPeriodIndexForDate(periods, selectedDay) === idx) closeAllPanels();
      return;
    }
    clearTimeout(deleteTimerRef.current);
    setConfirmDeleteIdx(idx);
    deleteTimerRef.current = setTimeout(() => setConfirmDeleteIdx(null), 3000);
  }
  function handleStartClick(date) {
    if (dateKey(date) === dateKey(TODAY)) {
      startPeriod(date);
      closeAllPanels();
    } else {
      setPendingStartDate(date);
    }
  }
  function confirmPendingStart(end) {
    startPeriod(pendingStartDate, end);
    closeAllPanels();
  }

  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const gridStart = addDays(firstOfMonth, -firstOfMonth.getDay());
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const weeksNeeded = Math.ceil((firstOfMonth.getDay() + daysInMonth) / 7);
  const cells = Array.from({ length: weeksNeeded * 7 }, (_, i) => addDays(gridStart, i));

  const dayPeriodIdx = selectedDay ? findPeriodIndexForDate(periods, selectedDay) : -1;
  const dayLog = selectedDay ? findLog(logs, selectedDay) : null;
  const dayRows = [];
  if (dayLog) {
    SYSTEMS.forEach((s) => {
      dayLog.entries[s.id].forEach((e) => dayRows.push({ system: s, entry: e }));
    });
  }

  function closeAllPanels() {
    setSelectedDay(null);
    setPendingStartDate(null);
    clearTimeout(deleteTimerRef.current);
    setConfirmDeleteIdx(null);
  }
  function handleDayClick(d) {
    if (d > TODAY) return;
    setSelectedDay(d);
    const idx = findPeriodIndexForDate(periods, d);
    if (idx !== -1) {
      setEditStart(dateKey(periods[idx].start));
      setEditEnd(periods[idx].end ? dateKey(periods[idx].end) : "");
    }
  }
  function commitDates(startStr, endStr) {
    if (dayPeriodIdx === -1) return;
    if (endStr && parseDateKey(endStr) < parseDateKey(startStr)) return;
    updatePeriod(dayPeriodIdx, { start: parseDateKey(startStr), end: endStr ? parseDateKey(endStr) : null });
  }
  const editDateInvalid = editEnd && parseDateKey(editEnd) < parseDateKey(editStart);

  // ---- Predicted next period, based on the user's average cycle length ----
  let predictedPeriod = null;
  if (periods.length >= 2) {
    const sortedPeriods = [...periods].sort((a, b) => a.start - b.start);
    const gaps = [];
    for (let i = 1; i < sortedPeriods.length; i++) gaps.push(daysBetween(sortedPeriods[i - 1].start, sortedPeriods[i].start));
    const avgCycleLength = Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length);
    const completed = sortedPeriods.filter((p) => p.end);
    const avgPeriodLength = completed.length > 0
      ? Math.round(completed.reduce((acc, p) => acc + daysBetween(p.start, p.end) + 1, 0) / completed.length)
      : 5;
    const lastPeriod = sortedPeriods[sortedPeriods.length - 1];
    let predictedStart = addDays(lastPeriod.start, avgCycleLength);
    let predictedEnd = addDays(predictedStart, avgPeriodLength - 1);
    while (predictedEnd < TODAY) {
      predictedStart = addDays(predictedStart, avgCycleLength);
      predictedEnd = addDays(predictedStart, avgPeriodLength - 1);
    }
    predictedPeriod = { start: predictedStart, end: predictedEnd, avgCycleLength };
  }
  function isWithinPredicted(date) {
    return predictedPeriod && date >= predictedPeriod.start && date <= predictedPeriod.end;
  }

  return (
    <div>
      <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 16, marginBottom: 18 }}>
        <div style={{ marginBottom: 10 }}>
          {currentCycleDay ? (
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 20, fontWeight: 600 }}>Day {currentCycleDay} of your cycle</div>
          ) : (
            <div style={{ fontSize: 13, color: COLORS.inkSoft }}>No period logged yet</div>
          )}
        </div>
        {!selectedDay && (
          <button
            onClick={() => onLogDay(new Date(TODAY))}
            style={{ width: "100%", padding: "14px 16px", borderRadius: 10, border: "none", background: COLORS.pelvicDark, color: "#fff", fontSize: 15, fontWeight: 600, cursor: "pointer", marginBottom: 12 }}
          >
            Log symptom
          </button>
        )}
        {!selectedDay && (
          <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 16 }}>
            Tap a day on the calendar to log a past day, or your period.
          </div>
        )}

        {selectedDay && (
          <div style={{ background: COLORS.bg, borderRadius: 10, padding: 12, marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontSize: 13, fontWeight: 600 }}>{formatDate(selectedDay)}</div>
              <button onClick={closeAllPanels} aria-label="Close" style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkFaint, minWidth: 24, minHeight: 24, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <X size={14} />
              </button>
            </div>

            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 11, color: COLORS.inkFaint, textTransform: "uppercase", letterSpacing: "0.03em", marginBottom: 6 }}>Symptoms logged</div>
              {dayRows.length > 0 && (
                <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
                  {dayRows.map(({ system, entry }, i) => (
                    <div key={entry.id} style={{ padding: "8px 0" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5 }}>
                        <span style={{ width: 8, height: 8, borderRadius: 8, background: system.color, flexShrink: 0 }} />
                        <span style={{ color: COLORS.ink, fontWeight: 500 }}>{symptomLabel(system, entry.symptomId)}</span>
                        <span style={{ color: COLORS.inkFaint }}>{system.short}</span>
                      </div>
                      {entry.location && <div style={{ color: COLORS.inkSoft, fontSize: 12, marginTop: 4, paddingLeft: 16 }}>Location: {entry.location}</div>}
                      {entry.note && <div style={{ color: COLORS.inkSoft, fontSize: 12, marginTop: 4, paddingLeft: 16 }}>{entry.note}</div>}
                    </div>
                  ))}
                </div>
              )}
              <button
                onClick={() => onLogDay(selectedDay)}
                style={{ marginTop: dayRows.length === 0 ? 2 : 10, padding: "8px 14px", borderRadius: 8, border: "none", background: COLORS.pelvicDark, color: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}
              >
                {dayRows.length === 0
                  ? (dateKey(selectedDay) === dateKey(TODAY) ? "Log symptom" : "Nothing logged · Log symptom")
                  : "Add or edit symptoms"}
              </button>
            </div>

            {pendingStartDate ? (
              <div>
                <div style={{ fontSize: 13, marginBottom: 10 }}>
                  Period started {formatDate(pendingStartDate)}. Tap the day it ended on the calendar below.
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button onClick={() => confirmPendingStart(null)} style={{ padding: "7px 12px", borderRadius: 8, border: `1px solid ${COLORS.line}`, background: "transparent", color: COLORS.inkSoft, fontSize: 12.5, cursor: "pointer" }}>
                    It's still ongoing
                  </button>
                  <button onClick={closeAllPanels} style={{ padding: "7px 12px", borderRadius: 8, border: `1px solid ${COLORS.line}`, background: "transparent", color: COLORS.inkSoft, fontSize: 12.5, cursor: "pointer" }}>
                    Cancel
                  </button>
                </div>
              </div>
            ) : dayPeriodIdx === -1 ? (
              periodActive ? null : (
                <button onClick={() => handleStartClick(selectedDay)} style={{ padding: "8px 14px", borderRadius: 8, border: "none", background: COLORS.ink, color: COLORS.bg, fontSize: 13, fontWeight: 500, cursor: "pointer" }}>
                  Period started
                </button>
              )
            ) : (
              <div>
                {(() => {
                  const periodIsOngoing = periods[dayPeriodIdx] && !periods[dayPeriodIdx].end;
                  return (
                    <>
                      <div style={{ fontSize: 11, color: COLORS.inkFaint, textTransform: "uppercase", letterSpacing: "0.03em", marginBottom: 8 }}>
                        {periodIsOngoing ? "Ongoing period" : "This day is part of a logged period"}
                      </div>
                      {!periodIsOngoing && (
                        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
                          <div style={{ flex: 1, minWidth: 130 }}>
                            <div style={{ fontSize: 11, color: COLORS.inkFaint, marginBottom: 4 }}>Start</div>
                            <input
                              type="date"
                              value={editStart}
                              max={dateKey(TODAY)}
                              onChange={(e) => { setEditStart(e.target.value); commitDates(e.target.value, editEnd); }}
                              style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13, color: COLORS.ink }}
                            />
                          </div>
                          <div style={{ flex: 1, minWidth: 130 }}>
                            <div style={{ fontSize: 11, color: COLORS.inkFaint, marginBottom: 4 }}>End</div>
                            <input
                              type="date"
                              value={editEnd}
                              min={editStart}
                              max={dateKey(TODAY)}
                              onChange={(e) => { setEditEnd(e.target.value); commitDates(editStart, e.target.value); }}
                              style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: `1px solid ${editDateInvalid ? COLORS.flare : COLORS.line}`, fontSize: 13, color: COLORS.ink }}
                            />
                          </div>
                        </div>
                      )}
                      {!periodIsOngoing && editDateInvalid && (
                        <div style={{ fontSize: 12, color: COLORS.flareText, marginBottom: 10 }}>End date can't be before the start date.</div>
                      )}
                    </>
                  );
                })()}
                {(() => {
                  const periodIsOngoing = periods[dayPeriodIdx] && !periods[dayPeriodIdx].end;
                  const deleteButton = (
                    <button
                      onClick={() => handleDeleteClick(dayPeriodIdx)}
                      style={{
                        display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", borderRadius: 8,
                        border: `1px solid ${COLORS.flareText}`,
                        background: confirmDeleteIdx === dayPeriodIdx ? COLORS.flareText : "transparent",
                        color: confirmDeleteIdx === dayPeriodIdx ? "#fff" : COLORS.flareText,
                        fontSize: 13, cursor: "pointer", fontWeight: confirmDeleteIdx === dayPeriodIdx ? 600 : 400,
                      }}
                    >
                      <Trash2 size={13} />
                      {confirmDeleteIdx === dayPeriodIdx ? "Tap again to confirm" : "Delete period"}
                    </button>
                  );
                  if (periodIsOngoing) {
                    return (
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        <button
                          onClick={() => {
                            updatePeriod(dayPeriodIdx, { end: selectedDay });
                            closeAllPanels();
                          }}
                          style={{ padding: "8px 14px", borderRadius: 8, border: `1px solid ${COLORS.line}`, background: "transparent", color: COLORS.inkSoft, fontSize: 13, fontWeight: 500, cursor: "pointer" }}
                        >
                          Period ended
                        </button>
                        {deleteButton}
                      </div>
                    );
                  }
                  return deleteButton;
                })()}
              </div>
            )}
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <button onClick={() => setCalendarMonth(new Date(year, month - 1, 1))} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkSoft, padding: 4 }}>
            <ChevronLeft size={18} />
          </button>
          <div style={{ fontSize: 13.5, fontWeight: 600 }}>{calendarMonth.toLocaleDateString("en-US", { month: "long", year: "numeric" })}</div>
          <button onClick={() => setCalendarMonth(new Date(year, month + 1, 1))} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkSoft, padding: 4 }}>
            <ChevronRight size={18} />
          </button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 4 }}>
          {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => (
            <div key={i} style={{ textAlign: "center", fontSize: 11, color: COLORS.inkFaint }}>{d}</div>
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
          {cells.map((d, i) => {
            const inMonth = d.getMonth() === month;
            const marked = isWithinPeriod(d, periods);
            const predicted = !marked && isWithinPredicted(d);
            const isToday = dateKey(d) === dateKey(TODAY);
            const isFuture = d > TODAY;
            const isBeforePendingStart = pendingStartDate && d < pendingStartDate;
            const isDisabled = isFuture || isBeforePendingStart;
            const isPendingStart = pendingStartDate && dateKey(d) === dateKey(pendingStartDate);
            const dayLogForCell = findLog(logs, d);
            const dotsSystems = dayLogForCell ? SYSTEMS.filter((s) => dayLogForCell.entries[s.id].length > 0) : [];
            return (
              <button
                key={i}
                onClick={() => (pendingStartDate ? confirmPendingStart(d) : handleDayClick(d))}
                disabled={isDisabled}
                style={{
                  aspectRatio: "1", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2,
                  borderRadius: 8,
                  border: isPendingStart
                    ? `2px solid ${COLORS.flare}`
                    : predicted
                    ? `1.5px dashed ${COLORS.pelvicDark}`
                    : isToday
                    ? `2px solid ${COLORS.ink}`
                    : "1px solid transparent",
                  background: marked ? COLORS.pelvicDark : "transparent",
                  color: marked ? "#fff" : inMonth ? COLORS.ink : COLORS.inkFaint,
                  opacity: isDisabled && !predicted ? 0.3 : inMonth ? 1 : 0.4, fontSize: 12.5, fontWeight: marked ? 600 : 400,
                  cursor: isDisabled ? "default" : "pointer", padding: 2,
                }}
              >
                {d.getDate()}
                <span style={{ display: "flex", gap: 1.5, height: 5 }}>
                  {dotsSystems.map((s) => (
                    <span key={s.id} style={{ width: 4, height: 4, borderRadius: 4, background: s.color, display: "inline-block", border: marked ? "1px solid rgba(255,255,255,0.6)" : "none" }} />
                  ))}
                </span>
              </button>
            );
          })}
        </div>

        {!selectedDay && predictedPeriod && (
          <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.pelvicDark, marginTop: 16, textAlign: "center" }}>
            Next period predicted {formatDate(predictedPeriod.start)}–{formatDate(predictedPeriod.end)}
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Cycle Log tab (read-only list of logged periods, separate from the calendar) ----------
function PeriodLogTab({ periods, logs }) {
  const [expandedIdx, setExpandedIdx] = useState(null);

  const rows = periods
    .map((p, i) => {
      const next = periods[i + 1];
      const cycleLength = next ? daysBetween(p.start, next.start) : null;
      const rangeEnd = next ? addDays(next.start, -1) : TODAY;
      return { idx: i, start: p.start, end: p.end, cycleLength, rangeEnd };
    })
    .slice()
    .reverse();

  return (
    <div>
      {periods.length === 0 ? (
        <div style={{ fontSize: 13, color: COLORS.inkFaint }}>No periods logged yet. Log one from the Calendar tab.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {rows.map((row) => {
            const isOpen = expandedIdx === row.idx;
            const cycleLogs = logs.filter((l) => l.dateObj >= row.start && l.dateObj <= row.rangeEnd);

            const bySystem = SYSTEMS.map((s) => {
              const count = cycleLogs.reduce((acc, l) => acc + systemCount(l.entries[s.id]), 0);
              return { ...s, count };
            });
            const hasData = bySystem.some((s) => s.count > 0);

            const notedEntries = [];
            [...cycleLogs].sort((a, b) => b.dateObj - a.dateObj).forEach((l) => {
              SYSTEMS.forEach((s) => {
                l.entries[s.id].forEach((e) => {
                  if ((e.note && e.note.trim()) || e.location) {
                    notedEntries.push({ date: l.dateLabel, symptom: symptomLabel(s, e.symptomId), note: e.note, location: e.location });
                  }
                });
              });
            });

            return (
              <div key={row.idx} style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "hidden" }}>
                <button
                  onClick={() => setExpandedIdx(isOpen ? null : row.idx)}
                  aria-expanded={isOpen}
                  style={{ width: "100%", background: "none", border: "none", cursor: "pointer", padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}
                >
                  <div style={{ fontSize: 13.5, color: COLORS.ink }}>Started {formatDate(row.start)}</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <div style={{ fontSize: 12.5, color: COLORS.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>
                      {row.cycleLength !== null ? `${row.cycleLength}-day cycle` : !row.end ? "Period in progress" : "Awaiting next period"}
                    </div>
                    <ChevronRight size={16} color={COLORS.inkFaint} style={{ transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.15s" }} />
                  </div>
                </button>

                {isOpen && (
                  <div style={{ padding: "0 14px 16px", borderTop: `1px solid ${COLORS.line}` }}>
                    {!hasData ? (
                      <div style={{ fontSize: 13, color: COLORS.inkFaint, marginTop: 14 }}>No symptoms logged during this cycle.</div>
                    ) : (
                      <>
                        <div style={{ marginTop: 14, marginBottom: notedEntries.length ? 16 : 0 }}>
                          <div style={{ fontSize: 11, color: COLORS.inkFaint, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}>This cycle's symptoms</div>
                          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            {(() => {
                              const maxCount = Math.max(1, ...bySystem.map((s) => s.count));
                              return bySystem
                                .filter((s) => s.count > 0)
                                .map((s) => {
                                  const breakdown = s.symptoms
                                    .map((sym) => ({
                                      sym,
                                      count: cycleLogs.reduce((acc, l) => acc + symptomCountForDay(l.entries[s.id], sym.id), 0),
                                      dates: cycleLogs
                                        .filter((l) => symptomCountForDay(l.entries[s.id], sym.id) > 0)
                                        .sort((a, b) => a.dateObj - b.dateObj)
                                        .map((l) => l.dateLabel),
                                    }))
                                    .filter((x) => x.count > 0)
                                    .sort((a, b) => b.count - a.count);
                                  return (
                                    <div key={s.id} style={{ background: COLORS.bg, borderRadius: 8, padding: "8px 12px" }}>
                                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 6 }}>
                                        <span style={{ fontWeight: 500 }}>{s.label}</span>
                                        <span style={{ color: COLORS.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>{s.count}×</span>
                                      </div>
                                      <div style={{ background: COLORS.surface, borderRadius: 6, height: 5, overflow: "hidden", marginBottom: breakdown.length ? 8 : 0 }}>
                                        <div style={{ width: `${(s.count / maxCount) * 100}%`, height: "100%", background: s.color, borderRadius: 6 }} />
                                      </div>
                                      {breakdown.length > 0 && (
                                        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                                          {breakdown.map((b) => (
                                            <div key={b.sym.id} style={{ fontSize: 11.5, lineHeight: 1.5 }}>
                                              <span style={{ color: COLORS.ink, fontWeight: 500 }}>{b.sym.label}</span>
                                              <span style={{ color: COLORS.inkFaint }}> — {b.dates.join(", ")}</span>
                                            </div>
                                          ))}
                                        </div>
                                      )}
                                    </div>
                                  );
                                });
                            })()}
                          </div>
                        </div>

                        {notedEntries.length > 0 && (
                          <div>
                            <div style={{ fontSize: 11, color: COLORS.inkFaint, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}>Notes from this cycle</div>
                            {notedEntries.map((n, i) => (
                              <div key={i} style={{ fontSize: 12.5, marginBottom: 8, lineHeight: 1.5 }}>
                                <span style={{ color: COLORS.inkFaint }}>{n.date} · {n.symptom}:</span>{" "}
                                {[n.location && `Location: ${n.location}`, n.note].filter(Boolean).join(" — ")}
                              </div>
                            ))}
                          </div>
                        )}
                      </>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---------- Summary tab (all-time doctor summary) ----------
function SummaryTab({ logs, periods }) {
  const [summaryRange, setSummaryRange] = useState("6m"); // "6m" | "all"

  // ---- Doctor summary (single page, condensed; scoped to selected range) ----
  const rangeCutoff = summaryRange === "6m" ? addDays(new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()), -182) : null;
  const rangeLogs = rangeCutoff ? logs.filter((l) => l.dateObj >= rangeCutoff) : logs;
  const rangePeriods = rangeCutoff ? periods.filter((p) => p.start >= rangeCutoff) : periods;

  const allSymptomStats = [];
  SYSTEMS.forEach((s) => {
    s.symptoms.forEach((sym) => {
      const occurrences = rangeLogs.filter((l) => symptomCountForDay(l.entries[s.id], sym.id) > 0);
      if (occurrences.length > 0) {
        const duringPeriod = occurrences.filter((l) => isWithinPeriod(l.dateObj, rangePeriods)).length;
        allSymptomStats.push({
          system: s, symptom: sym, count: occurrences.length,
          periodPct: Math.round((duringPeriod / occurrences.length) * 100),
        });
      }
    });
  });
  const topAllTimeSymptoms = allSymptomStats.sort((a, b) => b.count - a.count).slice(0, 5);

  const bySystemAllTime = SYSTEMS.map((s) => {
    const count = rangeLogs.reduce((acc, l) => acc + systemCount(l.entries[s.id]), 0);
    const breakdown = s.symptoms
      .map((sym) => {
        const matchingLogs = rangeLogs
          .filter((l) => symptomCountForDay(l.entries[s.id], sym.id) > 0)
          .sort((a, b) => a.dateObj - b.dateObj);
        return { sym, count: matchingLogs.length, dates: matchingLogs.map((l) => l.dateLabel) };
      })
      .filter((x) => x.count > 0)
      .sort((a, b) => b.count - a.count);
    return { ...s, count, breakdown };
  });
  const maxSystemCount = Math.max(1, ...bySystemAllTime.map((s) => s.count));

  let avgCycleLength = null;
  if (rangePeriods.length >= 2) {
    const gaps = [];
    for (let i = 1; i < rangePeriods.length; i++) gaps.push(daysBetween(rangePeriods[i - 1].start, rangePeriods[i].start));
    avgCycleLength = Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length);
  }

  const recentNotes = [];
  [...rangeLogs].sort((a, b) => b.dateObj - a.dateObj).forEach((l) => {
    SYSTEMS.forEach((s) => {
      l.entries[s.id].forEach((e) => {
        if ((e.note && e.note.trim()) || e.location) {
          recentNotes.push({ date: l.dateLabel, symptom: symptomLabel(s, e.symptomId), note: e.note, location: e.location });
        }
      });
    });
  });

  const hasAnyData = rangeLogs.length > 0;

  return (
    <div>
      {/* ---------- Doctor summary: single printable page ---------- */}
      <div className="print-hide" style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        {[{ id: "6m", label: "Last 6 months" }, { id: "all", label: "All time" }].map((opt) => (
          <button
            key={opt.id}
            onClick={() => setSummaryRange(opt.id)}
            style={{
              flex: 1, padding: "8px 12px", borderRadius: 8, fontSize: 13, fontWeight: 500, cursor: "pointer",
              border: `1px solid ${summaryRange === opt.id ? COLORS.pelvicDark : COLORS.line}`,
              background: summaryRange === opt.id ? COLORS.pelvicDark : "transparent",
              color: summaryRange === opt.id ? "#fff" : COLORS.inkSoft,
            }}
          >
            {opt.label}
          </button>
        ))}
      </div>

      <div id="doctor-summary" style={{ background: PRINT_COLORS.bg, border: `1px solid ${PRINT_COLORS.line}`, borderRadius: 14, padding: 24, marginBottom: 14 }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: 19, color: PRINT_COLORS.ink, marginBottom: 2 }}>
          Endometriosis Symptom Summary
          <span style={{ fontSize: 12, fontWeight: 400, color: PRINT_COLORS.inkFaint, marginLeft: 8 }}>
            {summaryRange === "6m" ? "· Last 6 months" : "· All time"}
          </span>
        </div>
        {!hasAnyData ? (
          <div style={{ fontSize: 13.5, color: PRINT_COLORS.inkFaint, marginTop: 10 }}>
            {summaryRange === "6m" ? "No entries logged in the last 6 months." : "No entries logged yet."}
          </div>
        ) : (
          <>
            <div style={{ display: "flex", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
              <div style={{ flex: 1, minWidth: 120, background: PRINT_COLORS.surface, borderRadius: 10, padding: "10px 12px" }}>
                <div style={{ fontSize: 10.5, color: PRINT_COLORS.inkFaint, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 4 }}>Periods tracked</div>
                <div style={{ fontSize: 16, fontWeight: 600, color: PRINT_COLORS.ink }}>{rangePeriods.length}</div>
              </div>
              <div style={{ flex: 1, minWidth: 120, background: PRINT_COLORS.surface, borderRadius: 10, padding: "10px 12px" }}>
                <div style={{ fontSize: 10.5, color: PRINT_COLORS.inkFaint, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 4 }}>Avg. cycle length</div>
                <div style={{ fontSize: 16, fontWeight: 600, color: PRINT_COLORS.ink }}>{avgCycleLength ? `${avgCycleLength} days` : "—"}</div>
              </div>
            </div>

            {topAllTimeSymptoms.length > 0 && (
              <div style={{ marginBottom: 18 }}>
                <div style={{ fontSize: 11, color: PRINT_COLORS.inkFaint, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}>Most frequent symptoms</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {topAllTimeSymptoms.map((t, i) => (
                    <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12.5, padding: "6px 0" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ width: 8, height: 8, borderRadius: 8, background: t.system.color, flexShrink: 0 }} />
                        <span style={{ color: PRINT_COLORS.ink, fontWeight: 500 }}>{t.symptom.label}</span>
                        <span style={{ color: PRINT_COLORS.inkFaint }}>{t.system.short}</span>
                      </div>
                      <div style={{ color: PRINT_COLORS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, textAlign: "right", whiteSpace: "nowrap" }}>
                        {t.count}× · {t.periodPct}% on period days
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div style={{ marginBottom: recentNotes.length ? 18 : 0 }}>
              <div style={{ fontSize: 11, color: PRINT_COLORS.inkFaint, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}>Symptoms by body system</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {bySystemAllTime.filter((s) => s.count > 0).map((s) => (
                  <div key={s.id}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: s.breakdown.length ? 6 : 0 }}>
                      <div style={{ fontSize: 11.5, color: PRINT_COLORS.ink, fontWeight: 500, width: 78, flexShrink: 0 }}>{s.short}</div>
                      <div style={{ flex: 1, background: PRINT_COLORS.surface, borderRadius: 6, height: 6, overflow: "hidden" }}>
                        <div style={{ width: `${(s.count / maxSystemCount) * 100}%`, height: "100%", background: s.color, borderRadius: 6 }} />
                      </div>
                      <div style={{ fontSize: 11, color: PRINT_COLORS.inkFaint, fontFamily: "'IBM Plex Mono', monospace", width: 28, textAlign: "right" }}>{s.count}×</div>
                    </div>
                    {s.breakdown.length > 0 && (
                      <div style={{ display: "flex", flexDirection: "column", gap: 3, paddingLeft: 88 }}>
                        {s.breakdown.map((b) => {
                          const shown = b.dates.slice(0, 6);
                          const extra = b.dates.length - shown.length;
                          return (
                            <div key={b.sym.id} style={{ fontSize: 11.5, lineHeight: 1.5 }}>
                              <span style={{ color: PRINT_COLORS.ink, fontWeight: 500 }}>{b.sym.label}</span>
                              <span style={{ color: PRINT_COLORS.inkFaint }}>
                                {" "}
                                {b.count}× — {shown.join(", ")}{extra > 0 ? ` +${extra} more` : ""}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>

            {recentNotes.length > 0 && (
              <div>
                <div style={{ fontSize: 11, color: PRINT_COLORS.inkFaint, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}>Notes</div>
                {recentNotes.map((n, i) => (
                  <div key={i} style={{ fontSize: 12, marginBottom: 6, lineHeight: 1.5, color: PRINT_COLORS.ink }}>
                    <span style={{ color: PRINT_COLORS.inkFaint }}>{n.date} · {n.symptom}:</span>{" "}
                    {[n.location && `Location: ${n.location}`, n.note].filter(Boolean).join(" — ")}
                  </div>
                ))}
              </div>
            )}
          </>
        )}
      </div>

      <button
        onClick={() => window.print()}
        className="print-hide"
        style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, width: "100%", padding: "12px 16px", borderRadius: 10, border: "none", background: COLORS.pelvicDark, color: "#fff", fontSize: 14, fontWeight: 500, cursor: "pointer", marginBottom: 32 }}
      >
        <Download size={16} />
        Export one-page summary for my doctor
      </button>
    </div>
  );
}

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
